# Render Blueprint: the backend as a free-tier web service, no Docker.
# The database is Neon Postgres (created separately); paste its connection string when Render asks for DATABASE_URL.
services:
  - type: web
    name: freight-desk-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: PREWARM
        value: "false"   # the free plan has 512 MB; warming the slowest models at start-up can exhaust it
      - key: ALLOW_DEMO_LOGIN
        value: "true"    # one-click demo accounts for reviewers; set to false for real users
      - key: SHOW_SIMULATED_FEEDS
        value: "false"
      - key: LIVE_SHIP_FEED
        value: "false"
